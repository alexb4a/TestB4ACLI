name: CI/CD Back4App Deploy Pipeline

on:
  push:
    branches:
      - staging
      - test
      - main

env:
  B4A_ACCOUNT_KEY: ${{ secrets.B4A_ACCOUNT_KEY }}

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Instalar dependências
        run: npm ci

      - name: Rodar ESLint
        run: npm run lint

      - name: Rodar Prettier (checagem)
        run: npx prettier --check .

      - name: Rodar build
        run: npm run build

      - name: Rodar testes
        run: npm test

  deploy_staging:
    if: github.ref == 'refs/heads/staging'
    runs-on: ubuntu-latest
    needs: checks
    steps:
      - uses: actions/checkout@v3

      - name: Instalar Back4App CLI
        run: curl -s https://raw.githubusercontent.com/back4app/parse-cli/back4app/installer.sh | sudo /bin/bash

      - name: Configurar CLI
        run: b4a configure accountkey ${{ secrets.B4A_ACCOUNT_KEY }} --default

      - name: Deploy para Staging App
        run: b4a deploy --app "ZuZTwiLmjLLkDm4sh2gTjNpbQIT0YHoI0lhNnmi7"

  deploy_test:
    if: github.ref == 'refs/heads/test'
    runs-on: ubuntu-latest
    needs: [checks, deploy_staging]
    steps:
      - uses: actions/checkout@v3

      - name: Instalar Back4App CLI
        run: |
          curl -s https://raw.githubusercontent.com/back4app/parse-cli/back4app/installer.sh | sudo /bin/bash
          b4a --version

      - name: Configurar CLI
        run: echo "${{ env.B4A_ACCOUNT_KEY }}" | b4a configure accountkey --stdin

      - name: Deploy para Test App
        run: b4a deploy --app "9gMCwQsaVruMX64kAVCKXVIDj2YvMEhHZ97js7P3"

  deploy_main:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    needs: [checks, deploy_test]
    steps:
      - uses: actions/checkout@v3

      - name: Instalar Back4App CLI
        run: |
          curl -s https://raw.githubusercontent.com/back4app/parse-cli/back4app/installer.sh | sudo /bin/bash
          b4a --version

      - name: Configurar CLI
        run: echo "${{ env.B4A_ACCOUNT_KEY }}" | b4a configure accountkey --stdin

      - name: Deploy para Main App
        run: b4a deploy --app "OSTQSiMml4v3sqc728fuNvjx9zs3DgnZZzutAj6W"
