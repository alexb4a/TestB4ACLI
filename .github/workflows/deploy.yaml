name: CI/CD Back4App Deploy Pipeline

on:
  push:
    branches:
      - staging
      - test
      - main

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Instalar dependências
        run: npm install

      - name: Rodar ESLint
        run: npm run lint

      - name: Rodar Prettier (checagem)
        run: npx prettier --check .

      - name: Rodar build
        run: npm run build

      - name: Rodar testes
        run: npm test

  deploy_staging:
    if: github.ref == 'refs/heads/staging'
    runs-on: ubuntu-latest
    needs: checks
    steps:
      - uses: actions/checkout@v3

      - name: Instalar Back4App CLI
        run: curl -s https://raw.githubusercontent.com/back4app/parse-cli/back4app/installer.sh | sudo /bin/bash

      - name: Deploy para Staging App
        run: b4a deploy Staging --description "Deploy Staging"

        env:
          B4A_ACCOUNT_KEY: ${{ secrets.B4A_ACCOUNT_KEY }}

  deploy_test:
    if: github.ref == 'refs/heads/test'
    runs-on: ubuntu-latest
    needs: [checks, deploy_staging]
    steps:
      - uses: actions/checkout@v3

      - name: Instalar Back4App CLI
        run: curl -s https://raw.githubusercontent.com/back4app/parse-cli/back4app/installer.sh | sudo /bin/bash

      - name: Deploy para Test App
        run: b4a deploy Test --description "Deploy Test"

        env:
          B4A_ACCOUNT_KEY: ${{ secrets.B4A_ACCOUNT_KEY }}

  deploy_main:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    needs: [checks, deploy_test]
    steps:
      - uses: actions/checkout@v3

      - name: Instalar Back4App CLI
        run: curl -s https://raw.githubusercontent.com/back4app/parse-cli/back4app/installer.sh | sudo /bin/bash

      - name: Deploy para Main App
        run: b4a deploy Main --description "Deploy Prod"

        env:
          B4A_ACCOUNT_KEY: ${{ secrets.B4A_ACCOUNT_KEY }}
